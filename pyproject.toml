[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["labelled_data_array"]

[project]
name = "labelled-data-array"
description = "A Python package for handling data arrays with axis labels"
authors = [
    { name = "claudio525" }
]
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">= 3.8"
dynamic=["version"]
dependencies = [
    "numpy",
    "pandas"
]

[tool.setuptools_scm]

[project.urls]
Source = "https://github.com/claudio525/labelled-data-array"

